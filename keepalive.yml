name: Keep Airy Alive
on:
  schedule:
    - cron: '*/5 * * * *' # каждые 5 минут
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: curl -s https://airy-bot-a4j6.onrender.com || echo "ping failed"
      - name: Ping Telegram (keep polling)
        run: curl -s https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/getMe || echo "tg ping"
